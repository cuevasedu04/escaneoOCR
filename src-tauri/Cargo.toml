[package]
name = "ocr-documentos"
version = "1.0.0"
description = "Búsqueda de texto en documentos PDF con OCR — ANAM"
authors = ["ANAM"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "ocr_documentos_lib"
crate-type = ["lib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
rusqlite            = { version = "0.32", features = ["bundled"] }
libloading          = "0.8"
walkdir             = "2"
crossbeam-channel   = "0.5"
jpeg-encoder        = "0.7"
windows             = { version = "0.61", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_System_WinRT",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 1

[profile.release]
opt-level = 3
strip = true

# Reduce peak compiler memory for large Windows crates
[profile.dev.package."windows-sys"]
codegen-units = 1
opt-level = "s"
debug = 0

[profile.dev.package."windows"]
codegen-units = 1
opt-level = "s"
debug = 0

[profile.dev.package."webview2-com-sys"]
codegen-units = 1
opt-level = "s"
debug = 0
